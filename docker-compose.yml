version: "3.8"

x-env: &env
  env_file:
    - .env

x-deps-full: &deps-full
  depends_on:
    rabbitmq:
      condition: service_healthy
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

x-node-build: &node-build
  context: .
  dockerfile: docker/Dockerfile

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmqctl", "status" ]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    <<: *env
    ports:
      - "5432:5432"
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    ports:
      - "5050:80"
    <<: *env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json

  auth-service:
    build:
      <<: *node-build
      args:
        SERVICE_DIR: auth-service
    container_name: auth-service
    <<: [ *env, *deps-full ]

  user-service:
    build:
      <<: *node-build
      args:
        SERVICE_DIR: user-service
    container_name: user-service
    <<: [ *env, *deps-full ]

  project-service:
    build:
      <<: *node-build
      args:
        SERVICE_DIR: project-service
    container_name: project-service
    <<: [ *env, *deps-full ]

  bids-service:
    build:
      <<: *node-build
      args:
        SERVICE_DIR: bids-service
    container_name: bids-service
    <<: [ *env, *deps-full ]

  search-service:
    build:
      <<: *node-build
      args:
        SERVICE_DIR: search-service
    container_name: search-service
    <<: [ *env, *deps-full ]

  kyc-service:
    build:
      <<: *node-build
      args:
        SERVICE_DIR: kyc-service
    container_name: kyc-service
    <<: [ *env, *deps-full ]

  posts-service:
    build:
      <<: *node-build
      args:
        SERVICE_DIR: posts-service
    container_name: posts-service
    <<: [ *env, *deps-full ]

  email-service:
    build:
      <<: *node-build
      args:
        SERVICE_DIR: email-service
    container_name: email-service
    <<: [ *env, *deps-full ]

  api-gateway:
    build:
      <<: *node-build
      args:
        SERVICE_DIR: api-gateway
    container_name: api-gateway
    <<: *env
    ports:
      - "${API_PORT}:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started

  admin-panel:
    build: ./admin-panel
    container_name: admin-panel
    ports:
      - "3001:80"
    depends_on:
      - api-gateway

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    command: [ "redis-server", "--save", "", "--appendonly", "no" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      retries: 5

volumes:
  auth_pgdata:
  pgadmin_data: