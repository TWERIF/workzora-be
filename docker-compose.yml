version: "3.8"

x-node-service: &node-service
  restart: unless-stopped
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
  depends_on:
    rabbitmq:
      condition: service_healthy
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_PUBLIC:-6379}:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json

  auth-service:
    <<: *node-service
    build: ./auth-service
    container_name: auth-service

  user-service:
    <<: *node-service
    build: ./user-service
    container_name: user-service

  project-service:
    <<: *node-service
    build: ./project-service
    container_name: project-service

  bids-service:
    <<: *node-service
    build: ./bids-service
    container_name: bids-service

  search-service:
    <<: *node-service
    build: ./search-service
    container_name: search-service

  kyc-service:
    <<: *node-service
    build: ./kyc-service
    container_name: kyc-service

  posts-service:
    <<: *node-service
    build: ./posts-service
    container_name: posts-service

  support-service:
    <<: *node-service
    build: ./support-service
    container_name: support-service

  notification-service:
    <<: *node-service
    build: ./notification-service
    container_name: notification-service

  email-service:
    <<: *node-service
    build: ./email-service
    container_name: email-service

  escrow:
    <<: *node-service
    build: ./escrow
    container_name: escrow

  api-gateway:
    <<: *node-service
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "${API_PORT:-8000}:${PORT:-8000}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started

  admin-panel:
    build: ./admin-panel
    container_name: admin-panel
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3001}:80"
    depends_on:
      - api-gateway

volumes:
  auth_pgdata:
  pgadmin_data:
