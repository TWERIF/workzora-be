name: Deploy backend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write .env from secret
        env:
          ROOT_ENV: ${{ secrets.ROOT_ENV }}
        run: |
          if [ -z "$ROOT_ENV" ]; then
            echo "ROOT_ENV secret is empty" >&2
            exit 1
          fi
          printf '%s\n' "$ROOT_ENV" > .env

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || '22' }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          source: "."
          target: "/var/www/workzora-be"
          timeout: 120s
          command_timeout: 30m

      - name: Build services one by one and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || '22' }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          timeout: 120s
          command_timeout: 110m
          script: |
            set -e
            exec 9>/var/lock/workzora-deploy.lock
            echo "Waiting for other deploys to finish"
            flock -w 3600 9
            cd /var/www/workzora-be
            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi
            for service in $($DC config --services); do
              echo "=== Building $service"
              $DC build "$service"
            done
            $DC up -d --remove-orphans
            docker image prune -f
            $DC ps
